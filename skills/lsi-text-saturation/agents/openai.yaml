interface:
  display_name: 'Насыщение текста LSI'
  short_description: 'LSI и N-граммы, затем снятие переспама'
  default_prompt: 'Используй $lsi-text-saturation в два этапа: сначала обработай первые 150 LSI-групп и N-граммы с 9+ сайтами и сохрани текст с реестром вставок, затем примени таблицу глубины только к этому результату, убрав переспам без удаления вставок и отката предыдущих правок.'

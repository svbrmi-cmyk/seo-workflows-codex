interface:
  display_name: "Насыщение текста LSI"
  short_description: "Усиливает ядро и отбирает релевантные группы из первых 200"
  default_prompt: "Используй $lsi-text-saturation: прочитай все файлы одной итерации, возьми первые 10–12 релевантных LSI-групп как ядро и доведи их до медианы, из первых 200 групп выбери остальные подходящие странице и используй их по одному разу, исключи шум, убери переспам и проверь точные фразы и пользовательские лимиты."

interface:
  display_name: 'Насыщение текста LSI'
  short_description: 'LSI и переспам без переписывания текста'
  default_prompt: 'Используй $lsi-text-saturation в два этапа без переписывания и дописывания текста: внедряй LSI и N-граммы только точечными заменами внутри существующих предложений, сохрани структуру, содержание, формулировки, логику, русскую грамматику, стиль и прежние LSI, затем сними переспам по таблице глубины без отката правок.'

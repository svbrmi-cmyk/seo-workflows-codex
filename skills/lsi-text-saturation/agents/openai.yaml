interface:
  display_name: "Насыщение текста LSI"
  short_description: "Усиливает ядро и распределяет первые 150 LSI-групп"
  default_prompt: "Используй $lsi-text-saturation: прочитай все файлы одной итерации, возьми первые 10–12 релевантных LSI-групп как ядро и доведи их до медианы, остальные релевантные группы из первых 150 используй по одному разу, исключи шум, убери переспам и проверь точные фразы и пользовательские лимиты."

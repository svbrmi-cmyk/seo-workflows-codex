interface:
  display_name: 'Насыщение текста LSI'
  short_description: 'Покрывает от 70% релевантных групп из первых 150'
  default_prompt: 'Используй $lsi-text-saturation: проверь первые 150 LSI-групп и N-граммы с 9+ сайтами, покажи факт до/после, выбери 10–15 продуктовых или брендовых групп как ядро и держи их в диапазоне медиана минус 2 — медиана, остальные релевантные группы используй 1–2 раза, N-граммы — ровно один раз; исключи шум и минимально измени исходный текст.'

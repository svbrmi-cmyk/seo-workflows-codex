interface:
  display_name: "Брендовый продуктовый бриф"
  short_description: "Объясняет пользу и отличия каждой категории бренда"
  default_prompt: "Используй $research-brand-category-products: сначала исследуй бренд через Perplexity API, затем при необходимости через обычный поиск; проверь страницу магазина, официальный сайт, надежные источники и официальные сайты сопоставимых конкурентов из топ-10. Выдай только готовый покупательский бриф, в котором для каждой категории раскрыты особенности, отличия, практическая польза, решаемые проблемы и ограничения."
